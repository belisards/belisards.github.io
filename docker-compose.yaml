services:
  belisario-website:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: belisario-website
    restart: unless-stopped
    expose:
      - "80"
    networks:
      web:
        aliases:
          - belisario-website
    labels:
      - traefik.enable=true
      # HTTP → HTTPS redirect
      - traefik.http.routers.belisario-http.entryPoints=http
      - traefik.http.routers.belisario-http.rule=Host(`site.omeu.website`)
      - traefik.http.routers.belisario-http.middlewares=redirect-to-https
      - traefik.http.middlewares.redirect-to-https.redirectscheme.scheme=https
      # HTTPS
      - traefik.http.routers.belisario-https.entryPoints=https
      - traefik.http.routers.belisario-https.rule=Host(`site.omeu.website`)
      - traefik.http.routers.belisario-https.tls=true
      - traefik.http.routers.belisario-https.tls.certresolver=letsencrypt
      - traefik.http.routers.belisario-https.middlewares=gzip
      - traefik.http.middlewares.gzip.compress=true
      # Service
      - traefik.http.services.belisario-website.loadbalancer.server.port=80

networks:
  web:
    external: true
