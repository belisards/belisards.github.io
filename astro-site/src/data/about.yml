bio: |
  <p>
    <strong>Adriano Belisario</strong> combines expertise in communication and data to address important human rights concerns.
    He is currently part of the Joint Data Center on Forced Displacement, a collaboration between the World Bank and UNHCR.
    Before this role, he contributed to organizations like Open Knowledge Brazil, Witness, Medialab/UFRJ,
    <a href="https://forensic-architecture.org/about/team/member/adriano-belisario">Forensic Architecture</a>,
    UNESCO, <a href="https://apublica.org/autor/adriano-belisario/">Agência Pública</a> and
    <a href="https://www.intercept.com.br/equipe/adriano-belisario/">The Intercept Brasil</a>.
    His publication portfolio includes <a href="/publications/">books, academic articles, and journalistic pieces</a>,
    and he has been invited to speak at several <a href="/events/">global events</a>.
  </p>
  <p>
    Belisario taught data journalism in Brazilian postgraduate courses and holds an MSc in Social Data Science from the
    Oxford Internet Institute (University of Oxford). While there, he collaborated with Instituto Fogo Cruzado to develop
    a language model that uses social media data to identify gun violence reports in real time. He also earned an MA in
    Communication and Culture from the Federal University of Rio de Janeiro (UFRJ). In partnership with Medialab/UFRJ
    and Agência Autônoma, Belisario co-developed <a href="https://documental.xyz">Documental.xyz</a>, an initiative
    that combines diverse investigative methods, such as Natural Language Processing, OSINT, and forensic architecture,
    with storytelling to equip grassroots communities with compelling evidence related to human rights violations.
  </p>

